<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
		<link rel="stylesheet" href="/iframe/style.css" />
		<title>PCB离线计价工具</title>
	</head>
	<body>
		<div class="container">
			<!-- 侧边栏 -->
			<aside class="sidebar">
				<h3>计价规则</h3>
				<div id="rulesList">
					<div class="rule-item active" data-rule-id="default">
						<div class="rule-name">默认规则</div>
						<div class="rule-type">按面积计价</div>
					</div>
				</div>
				<button class="btn btn-primary btn-small" style="width: 100%; margin-top: 12px" onclick="showNewRuleModal()">新建规则</button>
			</aside>

			<!-- 主内容区 -->
			<main class="main-content">
				<!-- 工具栏 -->
				<div class="toolbar">
					<div class="toolbar-left">
						<button class="btn btn-primary" onclick="GetPcbInfomation()">识别PCB信息</button>
						<button class="btn btn-primary" onclick="calculatePrice()">计算价格</button>
					</div>
					<div class="toolbar-right">
						<button class="btn btn-default" onclick="exportRules()">导出规则</button>
						<button class="btn btn-default" onclick="importRules()">导入规则</button>
					</div>
				</div>

				<!-- 内容区域 -->
				<div class="content-area">
					<!-- 左侧面板 - PCB参数 -->
					<div class="left-panel">
						<div class="form-section">
							<h3>基本信息</h3>

							<div class="form-group">
								<label for="board-type">板材类别</label>
								<select id="board-type" class="form-control">
									<option value="fpc">FPC软板</option>
									<option value="fr4" selected>FR-4</option>
									<option value="aluminum">铝基板</option>
									<option value="copper">铜基板</option>
									<option value="rogers">罗杰斯高频板</option>
									<option value="ptfe">铁氟龙高频板</option>
								</select>
							</div>

							<div class="form-group">
								<label>板子尺寸</label>
								<div class="input-group">
									<input type="number" id="length-input" class="form-control" placeholder="长" />
									<span class="unit">CM</span>
									<input type="number" id="width-input" class="form-control" placeholder="宽" />
									<span class="unit">CM</span>
								</div>
							</div>

							<div class="form-group">
								<label>板子层数</label>
								<div class="input-group">
									<input type="number" id="layer-input" class="form-control" />
									<span class="unit">层</span>
								</div>
							</div>

							<div class="form-group">
								<label for="product-type">产品类型</label>
								<select id="product-type" class="form-control">
									<option value="others">工业/消费/其他类电子产品</option>
									<option value="aviation">航空</option>
									<option value="help">医疗</option>
								</select>
							</div>

							<div class="form-group">
								<label>确认生产稿</label>
								<div class="input-group">
									<input type="number" id="verify-group" class="form-control" placeholder="不需要则放空" />
									<span class="unit">次</span>
								</div>
							</div>
						</div>

						<div class="form-section">
							<h3>PCB工艺</h3>
							<div id="processList"></div>
							<button class="btn btn-default btn-small" style="width: 100%; margin-top: 8px" onclick="showAddProcessModal()">
								添加自定义工艺
							</button>
						</div>
					</div>

					<!-- 右侧面板 - 计价规则 -->
					<div class="right-panel">
						<div class="form-section">
							<h3>计价方式</h3>
							<div class="tabs">
								<button class="tab active" data-tab="area" onclick="switchTab('area')">按面积计价</button>
								<button class="tab" data-tab="fixed" onclick="switchTab('fixed')">一次性付费</button>
								<button class="tab" data-tab="free" onclick="switchTab('free')">免费</button>
							</div>

							<div id="area-tab" class="tab-content active">
								<div class="form-group">
									<label>基础价格 (元/平方厘米)</label>
									<input type="number" id="base-price-area" class="form-control" value="0.5" step="0.01" />
								</div>
								<div class="form-group">
									<label>附加价格 (元)</label>
									<input type="number" id="extra-price-area" class="form-control" value="10" step="0.01" />
								</div>
								<p style="color: #5a6c7d; font-size: 12px; margin-top: 8px">=(基础价格 × 面积) + 附加价格</p>
							</div>

							<div id="fixed-tab" class="tab-content">
								<div class="form-group">
									<label>基础价格 (元)</label>
									<input type="number" id="base-price-fixed" class="form-control" value="100" step="0.01" />
								</div>
								<div class="form-group">
									<label>面积系数</label>
									<input type="number" id="area-factor" class="form-control" value="0.1" step="0.01" />
								</div>
								<p style="color: #5a6c7d; font-size: 12px; margin-top: 8px">=基础价格 + (面积系数 × 面积)</p>
							</div>

							<div id="free-tab" class="tab-content">
								<p style="color: #5a6c7d; font-size: 12px">此规则下所有订单免费</p>
							</div>
						</div>

						<div class="form-section">
							<h3>条件规则</h3>
							<div id="conditionsList"></div>
							<button class="btn btn-default btn-small" style="width: 100%; margin-top: 8px" onclick="addCondition()">
								添加条件规则
							</button>
						</div>
					</div>
				</div>
			</main>
		</div>

		<!-- 固定价格显示 -->
		<div class="price-display-fixed">
			<div class="price-label">预估价格</div>
			<div class="price-value" id="finalPrice">¥0.00</div>
		</div>

		<!-- ==================== 新建规则模态框 ==================== -->
		<div id="newRuleModal" class="modal">
			<div class="modal-mask" onclick="closeModal('newRuleModal')"></div>
			<div class="modal-dialog-box">
				<div class="modal-dialog modal-dialog-sm">
					<div class="modal-header">
						<h3>新建计价规则</h3>
						<button class="modal-close" onclick="closeModal('newRuleModal')">&times;</button>
					</div>
					<div class="modal-body">
						<div class="form-group">
							<label>规则名称</label>
							<input type="text" id="newRuleName" class="form-control" placeholder="输入规则名称" />
						</div>
						<div class="form-group">
							<label>计价方式</label>
							<select id="newRuleType" class="form-control">
								<option value="area">按面积计价</option>
								<option value="fixed">一次性付费</option>
								<option value="free">免费</option>
							</select>
						</div>
					</div>
					<div class="modal-footer">
						<button class="btn btn-default" onclick="closeModal('newRuleModal')">取消</button>
						<button class="btn btn-primary" onclick="createNewRule()">创建</button>
					</div>
				</div>
			</div>
		</div>

		<!-- ==================== 添加工艺模态框 ==================== -->
		<div id="addProcessModal" class="modal">
			<div class="modal-mask" onclick="closeModal('addProcessModal')"></div>
			<div class="modal-dialog-box">
				<div class="modal-dialog modal-dialog-sm">
					<div class="modal-header">
						<h3>添加自定义工艺</h3>
						<button class="modal-close" onclick="closeModal('addProcessModal')">&times;</button>
					</div>
					<div class="modal-body">
						<div class="form-group">
							<label>工艺名称</label>
							<input type="text" id="processName" class="form-control" placeholder="输入工艺名称" />
						</div>
						<div class="form-group">
							<label>输入类型</label>
							<select id="processType" class="form-control" onchange="toggleProcessInput()">
								<option value="select">下拉选择</option>
								<option value="input">数值输入</option>
								<option value="color">颜色选择</option>
							</select>
						</div>
						<div class="form-group" id="processOptionsGroup">
							<label>选项值（每行一个）</label>
							<textarea id="processOptions" class="form-control" rows="4" placeholder="选项1&#10;选项2&#10;选项3"></textarea>
						</div>
					</div>
					<div class="modal-footer">
						<button class="btn btn-default" onclick="closeModal('addProcessModal')">取消</button>
						<button class="btn btn-primary" onclick="addCustomProcess()">添加</button>
					</div>
				</div>
			</div>
		</div>

		<!-- ==================== 编辑工艺模态框 ==================== -->
		<div id="editProcessModal" class="modal">
			<div class="modal-mask" onclick="closeModal('editProcessModal')"></div>
			<div class="modal-dialog-box">
				<div class="modal-dialog modal-dialog-sm">
					<div class="modal-header">
						<h3>编辑自定义工艺</h3>
						<button class="modal-close" onclick="closeModal('editProcessModal')">&times;</button>
					</div>
					<div class="modal-body">
						<input type="hidden" id="editProcessId" />
						<div class="form-group">
							<label>工艺名称</label>
							<input type="text" id="editProcessName" class="form-control" placeholder="输入工艺名称" />
						</div>
						<div class="form-group">
							<label>输入类型</label>
							<select id="editProcessType" class="form-control" onchange="toggleEditProcessInput()">
								<option value="select">下拉选择</option>
								<option value="input">数值输入</option>
								<option value="color">颜色选择</option>
							</select>
						</div>
						<div class="form-group" id="editProcessOptionsGroup" style="display: none">
							<label>选项值（每行一个）</label>
							<textarea id="editProcessOptions" class="form-control" rows="4" placeholder="选项1&#10;选项2&#10;选项3"></textarea>
						</div>
					</div>
					<div class="modal-footer">
						<button class="btn btn-default" onclick="closeModal('editProcessModal')">取消</button>
						<button class="btn btn-primary" onclick="saveEditProcess()">保存</button>
					</div>
				</div>
			</div>
		</div>
	</body>

	<script>
		// ==================== 全局变量 ====================
		let allRules = {
			'default': {
				id: 'default',
				name: '默认规则',
				type: 'area',
				basePrice: 0.5,
				extraPrice: 10,
				conditions: [],
				customProcesses: [],
			},
		};
		let currentRuleId = 'default';
		let allProcesses = [];

		// ==================== 初始化 ====================
		document.addEventListener('DOMContentLoaded', function () {
			initializeProcesses();
			renderProcesses();
			renderRulesList();
			selectRule('default');
			renderConditions();
		});

		function initializeProcesses() {
			allProcesses = [
				{ id: 'put_together', name: '拼板款数', type: 'input', unit: '个' },
				{ id: 'delivery', name: '出货方式', type: 'select', options: ['单片', '拼板'] },
				{ id: 'copper_thick', name: '外层铜厚', type: 'input', unit: '盎司' },
				{ id: 'soldermask_color', name: '阻焊颜色', type: 'color', default: '#2E8B57' },
				{ id: 'content_color', name: '字符颜色', type: 'color', default: '#ffffff' },
				{
					id: 'solder_cover',
					name: '阻焊覆盖',
					type: 'select',
					options: ['过孔盖油', '过孔开窗', '过孔塞油', '过孔塞树脂+过孔电镀盖帽', '过孔塞铜浆+过孔电镀盖帽'],
				},
				{ id: 'solder_cover_type', name: '焊盘喷锡', type: 'select', options: ['有铅喷锡', '无铅喷锡', '沉金'] },
				{
					id: 'min_hole_diameter',
					name: '最小孔径/外径',
					type: 'select',
					options: ['0.3mm(外径0.4/0.45)', '0.25mm(外径0.35/0.4)', '0.2mm(外径0.3/0.35)', '0.15mm(外径0.25/0.3)'],
				},
				{ id: 'gold_finger_bevel', name: '金(锡)手指斜边', type: 'select', options: ['不需要', '需要'] },
				{ id: 'line_test', name: '线路测试', type: 'select', options: ['AOI全测+飞针全测'] },
			];
		}

		// ==================== 渲染函数 ====================
		// 持久化存储所有工艺控件值，防止 renderProcesses 重建 DOM 时丢失用户选择
		let savedProcessValues = {};

		function saveProcessValues() {
			const allProcessIds = [...allProcesses, ...(allRules[currentRuleId] ? allRules[currentRuleId].customProcesses || [] : [])];
			allProcessIds.forEach(function (p) {
				const el = document.getElementById('process-' + p.id);
				if (el) {
					if (p.type === 'color') {
						savedProcessValues[p.id] = el.value;
						// 同时保存颜色显示文本
						const span = el.nextElementSibling;
						if (span) {
							savedProcessValues[p.id + '_label'] = span.textContent;
						}
					} else {
						savedProcessValues[p.id] = el.value;
					}
				}
			});
		}

		function renderProcesses() {
			const processList = document.getElementById('processList');
			processList.innerHTML = '';
			const currentRule = allRules[currentRuleId];
			const currentCustomProcesses = currentRule ? currentRule.customProcesses : [];

			[...allProcesses, ...currentCustomProcesses].forEach(function (process) {
				const savedVal = savedProcessValues[process.id];
				const processItem = document.createElement('div');
				processItem.className = 'process-item';
				processItem.innerHTML =
					'<div class="process-name">' +
					process.name +
					'</div>' +
					'<div class="process-control">' +
					renderProcessControl(process, savedVal) +
					'</div>' +
					(process.custom
						? '<div class="process-actions">' +
							'<button class="icon-btn" onclick="editProcess(\'' +
							process.id +
							'\')" title="编辑">&#9998;</button>' +
							'<button class="icon-btn icon-btn-danger" onclick="deleteProcess(\'' +
							process.id +
							'\')" title="删除">&times;</button>' +
							'</div>'
						: '');
				processList.appendChild(processItem);
			});
		}

		function renderProcessControl(process, savedVal) {
			switch (process.type) {
				case 'select':
					return (
						'<select id="process-' +
						process.id +
						'" class="form-control" onchange="saveCurrentProcessValue(\'' +
						process.id +
						'\')">' +
						process.options
							.map(function (opt) {
								var sel = savedVal !== undefined && savedVal === opt ? ' selected' : '';
								return '<option value="' + opt + '"' + sel + '>' + opt + '</option>';
							})
							.join('') +
						'</select>'
					);
				case 'input':
					var inputVal = savedVal !== undefined && savedVal !== '' ? ' value="' + savedVal + '"' : '';
					return (
						'<div class="input-group">' +
						'<input type="number" id="process-' +
						process.id +
						'" class="form-control" placeholder="输入数值"' +
						inputVal +
						' onchange="saveCurrentProcessValue(\'' +
						process.id +
						'\')">' +
						(process.unit ? '<span class="unit">' + process.unit + '</span>' : '') +
						'</div>'
					);
				case 'color':
					var colorVal = savedVal || process.default || '#000000';
					var colorLabel = savedProcessValues[process.id + '_label'] || colorVal;
					return (
						'<div class="color-picker-wrapper">' +
						'<input type="color" id="process-' +
						process.id +
						'" class="color-picker" value="' +
						colorVal +
						'" onchange="saveCurrentProcessValue(\'' +
						process.id +
						'\')">' +
						'<span>' +
						colorLabel +
						'</span>' +
						'</div>'
					);
				default:
					return '';
			}
		}

		function saveCurrentProcessValue(processId) {
			var el = document.getElementById('process-' + processId);
			if (!el) return;
			savedProcessValues[processId] = el.value;
			// 颜色选择器同时保存标签
			var process = [...allProcesses, ...(allRules[currentRuleId] ? allRules[currentRuleId].customProcesses || [] : [])].find(function (p) {
				return p.id === processId;
			});
			if (process && process.type === 'color') {
				var span = el.nextElementSibling;
				if (span) {
					savedProcessValues[processId + '_label'] = span.textContent;
				}
			}
		}

		// 查找工艺定义（含自定义工艺）
		function findProcess(processId) {
			return [...allProcesses, ...(allRules[currentRuleId] ? allRules[currentRuleId].customProcesses || [] : [])].find(function (p) {
				return p.id === processId;
			});
		}

		function renderConditionValueControl(condition) {
			var process = findProcess(condition.process);
			// 如果关联的工艺是下拉类型，渲染为下拉选择
			if (process && process.type === 'select' && process.options) {
				return (
					'<select class="condition-input" onchange="updateCondition(' +
					condition.id +
					",'value',this.value)\">" +
					'<option value="">选择值</option>' +
					process.options
						.map(function (opt) {
							return '<option value="' + opt + '"' + (condition.value === opt ? ' selected' : '') + '>' + opt + '</option>';
						})
						.join('') +
					'</select>'
				);
			}
			// 其它类型（input/color/未关联工艺）用文本输入
			return (
				'<input type="text" class="condition-input" placeholder="值" value="' +
				(condition.value || '') +
				'" onchange="updateCondition(' +
				condition.id +
				",'value',this.value)\">"
			);
		}

		function renderConditions() {
			var conditionsList = document.getElementById('conditionsList');
			conditionsList.innerHTML = '';
			var currentRule = allRules[currentRuleId];
			if (!currentRule || currentRule.conditions.length === 0) {
				conditionsList.innerHTML = '<p style="color:#5a6c7d;text-align:center;font-size:12px">暂无条件规则</p>';
				return;
			}

			currentRule.conditions.forEach(function (condition) {
				var conditionDiv = document.createElement('div');
				conditionDiv.className = 'condition-rule';
				conditionDiv.innerHTML =
					'<div class="condition-header">' +
					'<span class="condition-title">条件规则 #' +
					condition.id +
					'</span>' +
					'<button class="icon-btn icon-btn-danger" onclick="removeCondition(' +
					condition.id +
					')" title="删除">&times;</button>' +
					'</div>' +
					'<div class="condition-body">' +
					'<span>如果</span>' +
					'<select class="condition-select" onchange="onConditionProcessChange(' +
					condition.id +
					',this.value)">' +
					'<option value="">选择工艺</option>' +
					[...allProcesses, ...(currentRule.customProcesses || [])]
						.map(function (p) {
							return '<option value="' + p.id + '"' + (condition.process === p.id ? ' selected' : '') + '>' + p.name + '</option>';
						})
						.join('') +
					'</select>' +
					'<select class="condition-select" onchange="updateCondition(' +
					condition.id +
					",'operator',this.value)\">" +
					['=', '>', '<', '>=', '<=']
						.map(function (op) {
							return '<option value="' + op + '"' + (condition.operator === op ? ' selected' : '') + '>' + op + '</option>';
						})
						.join('') +
					'</select>' +
					renderConditionValueControl(condition) +
					'<span>则价格</span>' +
					'<select class="condition-select" onchange="updateCondition(' +
					condition.id +
					",'action',this.value)\">" +
					'<option value="+"' +
					(condition.action === '+' ? ' selected' : '') +
					'>+</option>' +
					'<option value="-"' +
					(condition.action === '-' ? ' selected' : '') +
					'>-</option>' +
					'<option value="*"' +
					(condition.action === '*' ? ' selected' : '') +
					'>x</option>' +
					'<option value="/"' +
					(condition.action === '/' ? ' selected' : '') +
					'>/</option>' +
					'</select>' +
					'<input type="number" class="condition-input" placeholder="金额" value="' +
					condition.amount +
					'" onchange="updateCondition(' +
					condition.id +
					",'amount',this.value)\">" +
					'</div>';
				conditionsList.appendChild(conditionDiv);
			});
		}

		// 条件关联的工艺改变时：更新 process 字段，若新旧工艺类型不同则重置 value
		function onConditionProcessChange(conditionId, newProcessId) {
			var condition = allRules[currentRuleId].conditions.find(function (c) {
				return c.id === conditionId;
			});
			if (!condition) return;
			var oldProcess = findProcess(condition.process);
			condition.process = newProcessId;
			var newProcess = findProcess(newProcessId);
			// 工艺类型变了（select ↔ input），清空旧值，避免"沉金"去匹配数值
			if (!oldProcess || !newProcess || oldProcess.type !== newProcess.type) {
				condition.value = '';
			}
			renderConditions();
		}

		// ==================== 规则管理 ====================
		function renderRulesList() {
			const rulesList = document.getElementById('rulesList');
			rulesList.innerHTML = '';
			Object.values(allRules).forEach(function (rule) {
				const ruleItem = document.createElement('div');
				ruleItem.className = 'rule-item';
				ruleItem.dataset.ruleId = rule.id;
				ruleItem.innerHTML =
					'<div class="rule-name">' +
					rule.name +
					'</div>' +
					'<div class="rule-type">' +
					(rule.type === 'area' ? '按面积计价' : rule.type === 'fixed' ? '一次性付费' : '免费') +
					'</div>';
				ruleItem.onclick = function () {
					selectRule(rule.id);
				};
				rulesList.appendChild(ruleItem);
			});
		}

		function selectRule(ruleId) {
			if (!allRules[ruleId]) {
				return;
			}
			currentRuleId = ruleId;
			const currentRule = allRules[currentRuleId];

			document.querySelectorAll('.rule-item').forEach(function (item) {
				item.classList.remove('active');
			});
			const selectedItem = document.querySelector('[data-rule-id="' + ruleId + '"]');
			if (selectedItem) {
				selectedItem.classList.add('active');
			}

			document.querySelectorAll('.tab').forEach(function (t) {
				t.classList.remove('active');
			});
			document.querySelectorAll('.tab-content').forEach(function (c) {
				c.classList.remove('active');
			});

			const activeTab = document.querySelector('.tab[data-tab="' + currentRule.type + '"]');
			if (activeTab) {
				activeTab.classList.add('active');
				document.getElementById(currentRule.type + '-tab').classList.add('active');
			}

			renderProcesses();
			renderConditions();
		}

		// ==================== 条件规则 ====================
		function addCondition() {
			const condition = {
				id: Date.now(),
				process: '',
				operator: '=',
				value: '',
				action: '+',
				amount: 0,
			};
			allRules[currentRuleId].conditions.push(condition);
			renderConditions();
		}

		function updateCondition(id, field, value) {
			const condition = allRules[currentRuleId].conditions.find(function (c) {
				return c.id === id;
			});
			if (condition) {
				condition[field] = field === 'amount' ? parseFloat(value) || 0 : value;
			}
		}

		function removeCondition(id) {
			allRules[currentRuleId].conditions = allRules[currentRuleId].conditions.filter(function (c) {
				return c.id !== id;
			});
			renderConditions();
		}

		// ==================== 标签页 ====================
		function switchTab(tab) {
			document.querySelectorAll('.tab').forEach(function (t) {
				t.classList.remove('active');
			});
			document.querySelectorAll('.tab-content').forEach(function (c) {
				c.classList.remove('active');
			});
			event.target.classList.add('active');
			document.getElementById(tab + '-tab').classList.add('active');
			allRules[currentRuleId].type = tab;
		}

		// ==================== 工艺管理 ====================
		function showAddProcessModal() {
			document.getElementById('addProcessModal').classList.add('show');
		}

		function toggleProcessInput() {
			const type = document.getElementById('processType').value;
			document.getElementById('processOptionsGroup').style.display = type === 'select' ? 'block' : 'none';
		}

		function addCustomProcess() {
			const name = document.getElementById('processName').value;
			const type = document.getElementById('processType').value;
			const options = document
				.getElementById('processOptions')
				.value.split('\n')
				.filter(function (o) {
					return o.trim();
				});

			if (!name) {
				alert('请输入工艺名称');
				return;
			}
			if (type === 'select' && options.length === 0) {
				alert('请添加选项值');
				return;
			}

			const process = { id: 'custom_' + Date.now(), name: name, type: type, options: options, custom: true };
			if (!allRules[currentRuleId].customProcesses) {
				allRules[currentRuleId].customProcesses = [];
			}
			allRules[currentRuleId].customProcesses.push(process);

			renderProcesses();
			renderConditions();
			closeModal('addProcessModal');
			document.getElementById('processName').value = '';
			document.getElementById('processOptions').value = '';
		}

		function deleteProcess(processId) {
			if (confirm('确定要删除这个工艺吗？')) {
				const currentRule = allRules[currentRuleId];
				if (currentRule && currentRule.customProcesses) {
					currentRule.customProcesses = currentRule.customProcesses.filter(function (p) {
						return p.id !== processId;
					});
					renderProcesses();
					renderConditions();
				}
			}
		}

		function editProcess(processId) {
			const currentRule = allRules[currentRuleId];
			if (!currentRule || !currentRule.customProcesses) return;
			const process = currentRule.customProcesses.find(function (p) {
				return p.id === processId;
			});
			if (!process) return;

			document.getElementById('editProcessId').value = processId;
			document.getElementById('editProcessName').value = process.name;
			document.getElementById('editProcessType').value = process.type;

			if (process.type === 'select') {
				document.getElementById('editProcessOptionsGroup').style.display = 'block';
				document.getElementById('editProcessOptions').value = process.options ? process.options.join('\n') : '';
			} else {
				document.getElementById('editProcessOptionsGroup').style.display = 'none';
			}
			document.getElementById('editProcessModal').classList.add('show');
		}

		function saveEditProcess() {
			const processId = document.getElementById('editProcessId').value;
			const name = document.getElementById('editProcessName').value;
			const type = document.getElementById('editProcessType').value;
			const options = document
				.getElementById('editProcessOptions')
				.value.split('\n')
				.filter(function (o) {
					return o.trim();
				});

			if (!name) {
				alert('请输入工艺名称');
				return;
			}
			if (type === 'select' && options.length === 0) {
				alert('请添加选项值');
				return;
			}

			const currentRule = allRules[currentRuleId];
			if (!currentRule || !currentRule.customProcesses) return;
			const processIndex = currentRule.customProcesses.findIndex(function (p) {
				return p.id === processId;
			});
			if (processIndex === -1) return;

			currentRule.customProcesses[processIndex] = Object.assign({}, currentRule.customProcesses[processIndex], {
				name: name,
				type: type,
				options: options,
			});

			renderProcesses();
			renderConditions();
			closeModal('editProcessModal');
		}

		function toggleEditProcessInput() {
			const type = document.getElementById('editProcessType').value;
			document.getElementById('editProcessOptionsGroup').style.display = type === 'select' ? 'block' : 'none';
		}

		// ==================== 模态框 ====================
		function showNewRuleModal() {
			document.getElementById('newRuleModal').classList.add('show');
		}

		function closeModal(modalId) {
			document.getElementById(modalId).classList.remove('show');
		}

		function createNewRule() {
			const name = document.getElementById('newRuleName').value;
			const type = document.getElementById('newRuleType').value;

			if (!name) {
				alert('请输入规则名称');
				return;
			}

			const newRule = {
				id: Date.now().toString(),
				name: name,
				type: type,
				basePrice: 0.5,
				extraPrice: 10,
				conditions: [],
				customProcesses: [],
			};

			allRules[newRule.id] = newRule;
			renderRulesList();
			selectRule(newRule.id);
			closeModal('newRuleModal');
			document.getElementById('newRuleName').value = '';
		}

		// ==================== 价格计算 ====================
		function calculatePrice() {
			const length = parseFloat(document.getElementById('length-input').value) || 0;
			const width = parseFloat(document.getElementById('width-input').value) || 0;
			const area = length * width;
			let price = 0;
			const currentRule = allRules[currentRuleId];

			switch (currentRule.type) {
				case 'area':
					const basePrice = parseFloat(document.getElementById('base-price-area').value) || 0;
					const extraPrice = parseFloat(document.getElementById('extra-price-area').value) || 0;
					price = basePrice * area + extraPrice;
					break;
				case 'fixed':
					const fixedBase = parseFloat(document.getElementById('base-price-fixed').value) || 0;
					const areaFactor = parseFloat(document.getElementById('area-factor').value) || 0;
					price = fixedBase + areaFactor * area;
					break;
				case 'free':
					price = 0;
					break;
			}

			currentRule.conditions.forEach(function (condition) {
				const processValue = getProcessValue(condition.process);
				if (evaluateCondition(processValue, condition.value, condition.operator)) {
					switch (condition.action) {
						case '+':
							price += condition.amount;
							break;
						case '-':
							price -= condition.amount;
							break;
						case '*':
							price *= condition.amount;
							break;
						case '/':
							price /= condition.amount;
							break;
					}
				}
			});

			document.getElementById('finalPrice').textContent = '¥' + price.toFixed(2);
		}

		function getProcessValue(processId) {
			const element = document.getElementById('process-' + processId);
			return element ? element.value : '';
		}

		function evaluateCondition(actual, expected, operator) {
			// 空值保护：actual 为 undefined/null/空字符串时条件不生效
			if (actual === undefined || actual === null || actual === '') return false;
			if (expected === undefined || expected === null || expected === '') return false;

			// 统一 trim 防空格干扰
			var aStr = String(actual).trim();
			var eStr = String(expected).trim();

			// 尝试数字比较
			var aNum = parseFloat(aStr);
			var eNum = parseFloat(eStr);
			var bothNumeric = !isNaN(aNum) && !isNaN(eNum) && isFinite(aNum) && isFinite(eNum);

			if (bothNumeric) {
				// 双方都可解析为数字，按数值比较
				switch (operator) {
					case '=':
						return aNum === eNum;
					case '>':
						return aNum > eNum;
					case '<':
						return aNum < eNum;
					case '>=':
						return aNum >= eNum;
					case '<=':
						return aNum <= eNum;
					default:
						return false;
				}
			} else {
				// 字符串比较（如"沉金" = "沉金"）
				switch (operator) {
					case '=':
						return aStr === eStr;
					case '>':
						return aStr > eStr;
					case '<':
						return aStr < eStr;
					case '>=':
						return aStr >= eStr;
					case '<=':
						return aStr <= eStr;
					default:
						return false;
				}
			}
		}

		// ==================== PCB 识别 ====================
		async function GetPcbInfomation() {
			try {
				// 不传 net 参数（传 null 会导致查询失败返回 0 条）
				// 先用无参获取所有折线的 primitiveId，再通过 pcb_SelectControl 选中后取包围盒
				var ids = await eda.pcb_PrimitivePolyline.getAllPrimitiveId();

				if (!ids || ids.length === 0) {
					eda.sys_Message.showToastMessage('未识别到板框，请确认PCB板框存在或手动框选', 'error', 2);
					return;
				}

				eda.pcb_SelectControl.doSelectPrimitives(ids);
				var selected = await eda.pcb_SelectControl.getSelectedPrimitives();

				if (!selected || selected.length === 0) {
					eda.sys_Message.showToastMessage('未识别到板框，请确认PCB板框存在', 'error', 2);
					return;
				}

				// getSelectedPrimitives 返回的选择包围盒有 width/height（单位: mil）
				// mil → cm: 1 mil = 0.00254 cm
				var bounding = selected[0];
				var widthCm = bounding.width * 0.00254;
				var heightCm = bounding.height * 0.00254;
				var All_Layers = await eda.pcb_Layer.getAllLayers();

				document.getElementById('width-input').value = Math.round(widthCm * 100) / 100;
				document.getElementById('length-input').value = Math.round(heightCm * 100) / 100;
				document.getElementById('layer-input').value = calcLayers(All_Layers);
				eda.sys_Message.showToastMessage('识别成功', 'success', 2);
				calculatePrice();
			} catch (error) {
				eda.sys_Message.showToastMessage('未识别到板框或板框过多，请手动框选并重试', 'error', 2);
			}
		}

		function calcLayers(layers) {
			let count = 0;
			const ids = [1, 2].concat(
				Array.from({ length: 32 }, function (_, i) {
					return i + 15;
				}),
			);
			for (const layer of layers) {
				const id = parseInt(layer.id);
				if (ids.includes(id) && layer.layerStatus === 1) {
					count++;
				}
			}
			return count;
		}

		// ==================== 导入导出 ====================
		function exportRules(format) {
			format = format || 'xlsx';
			const rulesToExport = Object.assign({}, allRules);
			if (rulesToExport.default) {
				delete rulesToExport.default;
			}
			const exportedRulesArray = Object.values(rulesToExport);

			const commonData = {
				timestamp: new Date().toISOString(),
				currentRuleId: currentRuleId !== 'default' && allRules[currentRuleId] ? currentRuleId : null,
				rules: exportedRulesArray,
			};

			if (format === 'json') {
				const blob = new Blob([JSON.stringify(commonData, null, 2)], { type: 'application/json' });
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				a.download = 'pcb-pricing-rules-' + Date.now() + '.json';
				a.click();
				URL.revokeObjectURL(url);
				return;
			}

			const rows = [];
			exportedRulesArray.forEach(function (rule) {
				rows.push(flattenWithPaths(rule));
			});

			const headers = ['Field Path'].concat(
				exportedRulesArray.map(function (r) {
					return r.name || r.id;
				}),
			);
			const allPaths = Array.from(new Set(rows.flatMap(Object.keys))).sort();

			const worksheetData = [headers];
			allPaths.forEach(function (path) {
				const row = [path];
				rows.forEach(function (flatObj) {
					row.push(stringifyValue(flatObj[path]));
				});
				worksheetData.push(row);
			});

			const ws = XLSX.utils.aoa_to_sheet(worksheetData);
			const wb = XLSX.utils.book_new();
			XLSX.utils.book_append_sheet(wb, ws, 'Pricing Rules');
			XLSX.writeFile(wb, 'pcb-pricing-rules-' + Date.now() + '.xlsx');
		}

		function importRules(format) {
			const input = document.createElement('input');
			input.type = 'file';
			input.accept = '.json,.xlsx';
			input.onchange = function (e) {
				const file = e.target.files[0];
				if (!file) return;
				const reader = new FileReader();
				reader.onload = function (event) {
					try {
						let data = null;
						const useJson = format === 'json' || file.name.endsWith('.json');
						if (useJson) {
							data = JSON.parse(event.target.result);
							processImportedData(data);
						} else {
							const arrayBuffer = event.target.result;
							const workbook = XLSX.read(arrayBuffer, { type: 'array' });
							const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
							data = parseXlsxSheet(firstSheet);
							processImportedData(data);
						}
					} catch (error) {
						alert('导入失败：文件解析错误或格式不正确');
					}
				};
				if (file.name.endsWith('.xlsx')) {
					reader.readAsArrayBuffer(file);
				} else {
					reader.readAsText(file);
				}
				input.value = '';
			};
			input.click();
		}

		// ==================== 辅助函数 ====================
		function flattenWithPaths(obj, prefix, result) {
			prefix = prefix || '';
			result = result || {};
			for (const key in obj) {
				if (!obj.hasOwnProperty(key)) continue;
				const value = obj[key];
				const path = prefix ? prefix + '.' + key : key;
				if (value !== null && typeof value === 'object' && !Array.isArray(value)) {
					flattenWithPaths(value, path, result);
				} else {
					result[path] = value;
				}
			}
			return result;
		}

		function stringifyValue(val) {
			if (val == null) return '';
			if (typeof val === 'string') return val;
			if (typeof val === 'number' || typeof val === 'boolean') return String(val);
			return JSON.stringify(val);
		}

		function parseValue(val) {
			if (val == null || val === '') return null;
			const str = String(val).trim();
			if (str.toLowerCase() === 'true') return true;
			if (str.toLowerCase() === 'false') return false;
			const num = Number(str);
			if (!isNaN(num)) return num;
			try {
				return JSON.parse(str);
			} catch (e) {
				return str;
			}
		}

		function setByPath(obj, path, value) {
			const keys = path.split('.');
			let current = obj;
			for (let i = 0; i < keys.length - 1; i++) {
				const k = keys[i];
				if (!(k in current)) current[k] = {};
				current = current[k];
			}
			current[keys[keys.length - 1]] = value;
		}

		function parseXlsxSheet(sheet) {
			const data = XLSX.utils.sheet_to_json(sheet, { header: 1 });
			if (data.length < 2) throw new Error('Excel 文件为空');

			const headers = data[0];
			const rulesData = [];

			for (let ri = 1; ri < data.length; ri++) {
				const row = data[ri];
				const path = row[0];
				if (!path) continue;
				for (let ci = 1; ci < headers.length; ci++) {
					const ruleName = headers[ci];
					const rawValue = row[ci];
					if (!rulesData[ci - 1]) {
						rulesData[ci - 1] = { id: generateId(), name: ruleName };
					}
					setByPath(rulesData[ci - 1], path, parseValue(rawValue));
				}
			}

			return {
				timestamp: new Date().toISOString(),
				rules: rulesData,
				currentRuleId: null,
			};
		}

		function generateId() {
			return 'rule_' + Date.now() + Math.random().toString(36).substr(2, 5);
		}

		function processImportedData(data) {
			Object.keys(allRules).forEach(function (id) {
				if (id !== 'default') delete allRules[id];
			});

			if (data.rules && Array.isArray(data.rules)) {
				data.rules.forEach(function (rule) {
					if (rule.id) {
						allRules[rule.id] = rule;
					}
				});
			}

			let newCurrentRuleId = null;
			if (data.currentRuleId && allRules[data.currentRuleId]) {
				newCurrentRuleId = data.currentRuleId;
			} else {
				const nonDefaultIds = Object.keys(allRules).filter(function (id) {
					return id !== 'default';
				});
				newCurrentRuleId = nonDefaultIds.length > 0 ? nonDefaultIds[0] : 'default';
			}

			selectRule(newCurrentRuleId);
			renderRulesList();
			alert('规则导入成功！');
		}

		// 监听颜色选择器变化
		document.addEventListener('change', function (e) {
			if (e.target.type === 'color') {
				const span = e.target.nextElementSibling;
				if (span) {
					span.textContent = e.target.value;
				}
			}
		});
